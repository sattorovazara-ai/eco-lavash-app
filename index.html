<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Эко Лаваш 🌯</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
}

.hero{
background:linear-gradient(135deg,#ff7a00,#ffcc00);
padding:70px 20px;
text-align:center;
}

.hero h1{
font-size:42px;
margin:0;
}

.hero p{
font-size:18px;
margin-top:10px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1b1b1b;
border-radius:20px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.4);
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h2{
margin:15px;
font-size:24px;
}

.price{
margin:0 15px 20px;
font-size:22px;
color:#ffcc00;
font-weight:bold;
}

footer{
text-align:center;
padding:30px;
background:#000;
margin-top:40px;
}
</style>
</head>

<body>

<div class="hero">
<h1>Эко Лаваш 🌯</h1>
<p>Вкусный фастфуд в твоем городе</p>
</div>

<div class="menu">

<div class="card">
<img src="IMG_0704.jpeg">
<h2>Блэкбургер</h2>
<p class="price">35 сомони</p>
</div>

<div class="card">
<img src="IMG_0705.jpeg">
<h2>Стрипсы</h2>
<p class="price">10 сомони</p>
</div>

<div class="card">
<img src="IMG_1296.jpeg">
<h2>Маффин на завтрак</h2>
<p class="price">25 сомони</p>
</div>

<div class="card">
<img src="IMG_1297.jpeg">
<h2>Чизбургер</h2>
<p class="price">30 сомони</p>
</div>

<div class="card">
<img src="ADC50086-F8D0-4291-8C11-AC29DE.jpeg">
<h2>Чикенбургер</h2>
<p class="price">20 сомони</p>
</div>

<div class="card">

<h2>Шаурма</h2>
<p class="price">20-25 сомони</p>
</div>

<div class="card">
<img src="3D6CFB7A-C64B-4072-951A-10B11627.jpeg">
<h2>Royal Combo</h2>
<p class="price">29 сомони</p>
</div>

<div class="card">
<img src="8b695c0a-e83c-4d05-b590-229f0828.jpeg">

<p class="price">43 сомони</p>
</div>

</div>

<footer>
© 2026 Эко Лаваш
</footer>

</html>
